[project]
name = "codesearch"
version = "0.1.0"
description = "Semantic code search over open-source Python repositories"
requires-python = ">=3.11"

# Runtime dependencies.
# Pinned to specific versions so builds are reproducible.
# If you upgrade, retest the whole pipeline — sentence-transformers
# and faiss are the picky ones.
dependencies = [
    "fastapi==0.115.0",           # web framework (async)
    "uvicorn[standard]==0.30.6",  # ASGI server (production-ready)
    "pydantic==2.9.2",            # request/response models
    "pydantic-settings==2.5.2",   # env-var config
    "sentence-transformers==3.1.1",  # embeddings (wraps HuggingFace)
    "faiss-cpu==1.8.0",           # vector index (Facebook's ANN library)
    "httpx==0.27.2",              # async HTTP client (for GitHub API)
    "tenacity==9.0.0",            # retry logic for flaky API calls
    "prometheus-client==0.20.0",  # /metrics endpoint for observability
    "rich==13.8.1",               # pretty CLI output during ingest
    "tqdm==4.66.5",               # progress bars
    "orjson==3.10.7",             # fast JSON (faster than stdlib)
    "numpy>=1.26,<2.0",           # faiss-cpu is not yet numpy 2 compatible
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "ruff==0.6.8",                # linter + formatter
    "mypy==1.11.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"


[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["frontend*", "tests*", "scripts*", "data*", "docs*"]