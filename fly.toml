app = "codesearch-mirisan"          # <-- change this to something unique
primary_region = "yyz"               # yyz = Toronto; pick your closest region

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  LOG_LEVEL = "info"

# Persistent volume for the FAISS index (index is rebuilt offline, uploaded here)
[[mounts]]
  source = "codesearch_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"        # stop when idle to save cost
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "get"
    path = "/healthz"

# Bigger memory because sentence-transformer + FAISS live in RAM.
# 1GB is a safe minimum for MiniLM + a few hundred K vectors.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
